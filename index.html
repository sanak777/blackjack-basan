function cardSignature(s){
  const dealer=(s.dealerHand||[]).length;
  let players=0;
  (s.players||[]).forEach(p=>{
    if(!p)return;
    (p.hands||[]).forEach(h=>players+=(h.cards||[]).length);
  });
  return dealer+'|'+players;
}
function maybePlayDealSound(nextState){
  const sig=cardSignature(nextState);
  if(lastCardSignature){
    const [od,op]=lastCardSignature.split('|').map(Number);
    const [nd,np]=sig.split('|').map(Number);
    const added=Math.max(0,(nd-od)+(np-op));
    if(added>0){
      for(let i=0;i<Math.min(added,6);i++)setTimeout(playCardSound,i*85);
    }
  }
  lastCardSignature=sig;
}
socket.on('state',s=>{
 maybePlayDealSound(s);
 state=s;
 mySeat=s.mySeat;
 if(mySeat!==null) selected=mySeat;
 render();
});

function handValue(cards){
 let total=0,aces=0;
 (cards||[]).forEach(c=>{
   if(c.r==='A'){total+=11;aces++}
   else if(['K','Q','J'].includes(c.r)) total+=10;
   else total+=Number(c.r);
 });
 while(total>21&&aces){total-=10;aces--}
 return total;
}
function chipClass(v){
 if(v>=500000)return'c100';
 if(v>=200000)return'c50';
 if(v>=100000)return'c10';
 if(v>=50000)return'c5';
 return'c1';
}
function panelChipHTML(total,lastValue){
 if(!total)return '';
 const chipValue=lastValue||total, cls=chipClass(chipValue), label=`₩${Math.round(chipValue/1000)}K`;
 const layers=Math.min(5,Math.max(1,Math.ceil(total/Math.max(chipValue,1))));
 let h='';
 for(let i=0;i<layers;i++) h+=`<div class="panelChip ${cls}" style="top:${50-i*7}%"><span>${label}</span></div>`;
 h+=`<div class="panelBetAmount">${money(total)}</div>`;
 return h;
}
function updatePersonalBetButtons(){
 const p=(mySeat!==null)?state.players[mySeat]:null;
 const main=$('#mainPanelStack'),pair=$('#pairPanelStack'),trio=$('#trioPanelStack'),mainBtn=$('#simpleMain');
 if(!main||!pair||!trio)return;
 const sig=p?`${mySeat}|${p.bet.main}|${p.bet.pair}|${p.bet.trio}|${p.betLast?.main||0}|${p.betLast?.pair||0}|${p.betLast?.trio||0}`:'none';
 if(sig===lastPersonalBetSignature)return;
 lastPersonalBetSignature=sig;
 if(!p){main.innerHTML=pair.innerHTML=trio.innerHTML=''; if(mainBtn)mainBtn.classList.remove('hasBet'); return;}
 const last=p.betLast||{main:0,pair:0,trio:0};
 main.innerHTML=panelChipHTML(p.bet.main,last.main);
 pair.innerHTML=panelChipHTML(p.bet.pair,last.pair);
 trio.innerHTML=panelChipHTML(p.bet.trio,last.trio);
 if(mainBtn)mainBtn.classList.toggle('hasBet',p.bet.main>0);
}
function setBetMode(mode){
 betMode=mode;
 $('#simpleMain')?.classList.toggle('active',mode==='main');
 $('#simplePair')?.classList.toggle('active',mode==='pair');
 $('#simpleTrio')?.classList.toggle('active',mode==='trio');
}
['main','pair','trio'].forEach(mode=>{
 const id=mode==='main'?'simpleMain':mode==='pair'?'simplePair':'simpleTrio';
 $('#'+id)?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setBetMode(mode)});
});
document.querySelectorAll('.chipBtn').forEach(btn=>{
 btn.onclick=()=>{
   if(mySeat===null)return alert('먼저 빈 좌석에 착석하세요.');
   unlockSound();
   playChipSound();
   socket.emit('betAdd',{token,mode:betMode,value:+btn.dataset.v});
 };
});
$('#undoBet').onclick=()=>socket.emit('betUndo',{token});
$('#clearBet').onclick=()=>socket.emit('betClear',{token});
$('#confirmBet').onclick=()=>socket.emit('betConfirm',{token});
$('#hitBtn').onclick=()=>socket.emit('turnAction',{token,action:'hit'});
$('#standBtn').onclick=()=>socket.emit('turnAction',{token,action:'stand'});
$('#doubleBtn').onclick=()=>socket.emit('turnAction',{token,action:'double'});
$('#splitBtn').onclick=()=>socket.emit('turnAction',{token,action:'split'});

function betSecondsLeft(p){
 if(!p?.betDeadline)return 0;
 const serverNow=state.serverNow||Date.now();
 return Math.max(0,Math.ceil((p.betDeadline-serverNow)/1000));
}
function playerBadge(p,i){
 if(state.tournamentOver&&p.lastAction==='CHAMPION')return {txt:'🏆 FINAL WINNER',cls:'champion'};
 if(!state.gameStarted){
   if(p.confirmed)return {txt:p.autoConfirmed?'AUTO BET ✓':'BET ✓',cls:p.autoConfirmed?'auto':'done'};
   const sec=betSecondsLeft(p);
   const total=(p.bet?.main||0)+(p.bet?.pair||0)+(p.bet?.trio||0);
   if(total>0)return {txt:`BETTING${sec?` · ${sec}s`:''}`,cls:'betting'};
   return {txt:`NO BET${sec?` · ${sec}s`:''}`,cls:'wait'};
 }
 const hands=p.hands||[];
 if(hands.length&&hands.every(h=>h.state==='BUST'||h.result==='BUST'))return {txt:'BUST · OUT',cls:'bust'};
 if(i===state.turnSeat)return {txt:'▶ MY TURN',cls:'turn'};
 if(p.lastAction&&p.lastAction.includes('STAND'))return {txt:`${p.lastAction} ✓`,cls:'stand'};
 if(p.lastAction==='BUST'||String(p.lastAction||'').includes('BUST'))return {txt:p.lastAction,cls:'bust'};
 if(p.lastAction&&p.lastAction!=='WAIT'&&p.lastAction!=='TURN')return {txt:p.lastAction,cls:'done'};
 return {txt:'WAIT',cls:'wait'};
}
function render(){
 const players=state.players||Array(10).fill(null);
 const eliminatedSeats=state.eliminatedSeats||Array(10).fill(null);
 $('#status').textContent=state.status||'';
 const dc=$('#dealerCards');
 let dealerHTML='';
 (state.dealerHand||[]).forEach((c,idx)=>{
   const hidden=c.hidden;
   if(hidden) dealerHTML+='<div class="dealerCard back"></div>';
   else{
     const red=(c.s==='♥'||c.s==='♦')?' red':'';
     dealerHTML+=`<div class="dealerCard${red}"><div style="position:relative;z-index:2;line-height:.9">${c.r}</div><div style="position:relative;z-index:2;font-size:.78em;margin-top:5px">${c.s}</div></div>`;
   }
 });
 dc.innerHTML=dealerHTML;
 const visibleDealer=(state.dealerHand||[]).filter(c=>!c.hidden);
 $('#dealerScore').textContent=visibleDealer.length?(state.hideHole?`OPEN ${handValue(visibleDealer.slice(0,1))}`:`TOTAL ${handValue(visibleDealer)}`):'';

 for(let i=0;i<seatButtons.length;i++){
   const occupied=!!players[i];
   const eliminated=!!eliminatedSeats[i];
   const unavailable=occupied||eliminated;
   seatButtons[i].classList.toggle('seatOccupied',occupied);
   seatButtons[i].classList.toggle('seatEliminated',eliminated);
   seatButtons[i].style.setProperty('display',unavailable?'none':'block','important');
   seatButtons[i].style.setProperty('visibility',unavailable?'hidden':'visible','important');
   seatButtons[i].style.pointerEvents=unavailable?'none':'auto';
   seatButtons[i].classList.remove('selected');
 }

 let html='';
 for(let i=0;i<eliminatedSeats.length;i++){
   const e=eliminatedSeats[i]; if(!e)continue;
   const sx=seats[i][0],sy=seats[i][1];
   html+=`<div class="eliminatedSeat" style="left:${sx}%;top:${sy+5.7}%">${escHTML(e.name||('SEAT '+(i+1)))}<b>탈락 자리 · 재참가 불가</b></div>`;
 }
 for(let i=0;i<players.length;i++){
   const p=players[i]; if(!p)continue;
   const sx=seats[i][0],sy=seats[i][1];
   const owner=i===mySeat?' · YOU':'';
   const badge=playerBadge(p,i);
   html+=`<div class="occupied" style="left:${sx}%;top:${sy+7.2}%">${escHTML(p.name)}${owner}<b>${money(p.bank)}</b><span class="playerStateBadge ${badge.cls}">${escHTML(badge.txt)}</span>${p.roundResult?`<span class="roundResult">${escHTML(p.roundResult)}</span>`:''}</div>`;
   if(p.hands&&p.hands.length){
     const allBust=p.hands.every(x=>x.state==='BUST');
     html+=`<div class="handGroup${allBust?' busted':''}" style="left:${sx}%;top:${sy-6.2}%">`;
     p.hands.forEach((h,hi)=>{
       let cls='handTag';
       if(h.state==='BUST'||h.result==='BUST')cls+=' bust';
       else if(h.result==='WIN'||h.result==='BLACKJACK')cls+=' win';
       else if(h.result==='LOSE')cls+=' lose';
       else if(h.result==='PUSH')cls+=' push';
       const hv=handValue(h.cards||[]);
       const shown=(h.state==='BUST'||h.result==='BUST')?`BUST ${hv}`:`${hv}`;
       const txt=p.hands.length>1?`H${hi+1} · ${shown}${h.doubled?' · DOUBLE':''}${h.result&&h.result!=='BUST'?' · '+h.result:''}`:`${shown}${h.doubled?' · DOUBLE':''}${h.result&&h.result!=='BUST'?' · '+h.result:''}`;
       html+=`<div class="${cls}">${escHTML(txt)}</div><div class="handRow">`;
       (h.cards||[]).forEach(c=>{
         const red=(c.s==='♥'||c.s==='♦')?' red':'';
         html+=`<div class="playerCard${red}"><div style="position:relative;z-index:2;line-height:.9">${c.r}</div><div style="position:relative;z-index:2;font-size:.78em;margin-top:3px">${c.s}</div></div>`;
       });
       html+='</div>';
     });
     html+='</div>';
   }
   for(const mode of ['main','pair','trio']){
     const bp=betPos[i][mode],label=mode==='main'?'MAIN':mode==='pair'?'PP':'21+3';
     html+=`<div class="betLabel" style="left:${bp[0]}%;top:${bp[1]-3.5}%">${label}</div>`;
   }
 }
 $('#overlay').innerHTML=html;

 const p=mySeat!==null?players[mySeat]:null;
 updatePersonalBetButtons();
 const summary=$('#betSummary');
 const aliveCount=players.filter(Boolean).length;
 if(!p) summary.textContent=state.tournamentStarted?'대회 진행 중 · 중간 참가 불가':'빈 좌석을 눌러 착석하면 베팅할 수 있습니다.';
 else{
   const total=p.bet.main+p.bet.pair+p.bet.trio;
   const sec=betSecondsLeft(p);
   const betState=p.confirmed?(p.autoConfirmed?' · 자동 베팅 완료':' · 베팅 완료'):(sec?` · 자동확정까지 ${sec}초`:'');
   summary.textContent=`${p.name} · 내 좌석 ${mySeat+1} · 보유금 ${money(p.bank)} · MAIN ${money(p.bet.main)} · PP ${money(p.bet.pair)} · 21+3 ${money(p.bet.trio)} · 합계 ${money(total)}${betState}`;
 }
 const notice=$('#gameStartNotice'),clock=$('#betClock');
 if(state.tournamentOver){
   notice.textContent=`🏆 ${state.winnerName||'WINNER'} 최종 우승`;
   clock.textContent='토너먼트 종료';
 }else if(!state.tournamentStarted){
   notice.textContent=`방장이 게임을 시작합니다 · ${aliveCount} / 10`;
   const secs=Math.max(0,...players.filter(Boolean).map(x=>betSecondsLeft(x)));
   clock.textContent=aliveCount===10?(secs?`개인 베팅시간 ${secs}초 · 미확정은 시간 종료 시 자동베팅`:'전원 베팅 완료 대기 중'):'';
 }else if(state.gameStarted){
   notice.textContent=`생존 ${aliveCount}명 · 최후 1인까지 진행`;
   clock.textContent='';
 }else{
   const done=players.filter(x=>x&&x.confirmed).length;
   const secs=Math.max(0,...players.filter(Boolean).map(x=>betSecondsLeft(x)));
   notice.textContent=`생존 ${aliveCount}명 · 베팅 완료 ${done} / ${aliveCount}`;
   clock.textContent=secs?`개인 베팅시간 ${secs}초 · 시간 종료 시 현재 금액 자동확정`:'';
 }
 const exitResetBtn=$('#exitResetBtn');
 if(exitResetBtn)exitResetBtn.classList.toggle('show',!!state.tournamentOver);

 const insuranceModal=$('#insuranceModal');
 const insuranceAmount=$('#insuranceAmount');
 const insuranceClock=$('#insuranceClock');
 const insurancePending=!!(state.insuranceOpen&&p&&p.inRound&&p.insuranceDecision===null);
 if(insurancePending){
   const amt=Math.floor(Number(p.bet?.main||0)/2);
   const sec=state.insuranceDeadline?Math.max(0,Math.ceil((state.insuranceDeadline-Date.now())/1000)):state.insuranceSeconds||10;
   insuranceAmount.textContent=`보험금 ${money(amt)} · 당첨 시 2:1`;
   insuranceClock.textContent=`선택시간 ${sec}초 · 미선택 시 보험 안함`;
   $('#insuranceYes').disabled=amt<=0||Number(p.bank||0)<amt;
   insuranceModal.classList.add('show');
 }else{
   insuranceModal.classList.remove('show');
 }

 const bettingLocked=!p||state.gameStarted||state.tournamentOver||p.confirmed;
 document.querySelectorAll('.chipBtn').forEach(b=>b.disabled=bettingLocked);
 $('#undoBet').disabled=bettingLocked;
 $('#clearBet').disabled=bettingLocked;
 $('#confirmBet').disabled=bettingLocked;
 const myTurn=state.gameStarted&&state.turnSeat===mySeat&&!state.dealing&&!state.settling&&!state.insuranceOpen;
 $('#turnActions').classList.toggle('show',!!myTurn);
 const h=myTurn&&p?.hands?p.hands[state.activeHandIndex]:null;
 $('#hitBtn').disabled=!myTurn;
 $('#standBtn').disabled=!myTurn;
 $('#doubleBtn').disabled=!(myTurn&&state.canDouble);
 $('#splitBtn').disabled=!(myTurn&&state.canSplit);
 $('#turnInfo').textContent=myTurn&&h?`${p.name} · HAND ${state.activeHandIndex+1}/${p.hands.length} · 현재 ${handValue(h.cards)}`:(state.turnSeat!==null&&players[state.turnSeat]?`${players[state.turnSeat].name} 차례`:'');
}
const introScreen=$('#introScreen');
const enterTable=$('#enterTable');
if(introScreen && $('#bg')){
  const syncIntroBg=()=>{
    const src=$('#bg').getAttribute('src');
    if(src) introScreen.style.backgroundImage=`linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.72)),url("${src}")`;
  };
  if($('#bg').complete) syncIntroBg(); else $('#bg').addEventListener('load',syncIntroBg,{once:true});
}
enterTable?.addEventListener('click',()=>{unlockSound();introScreen?.classList.add('hide')});
socket.on('connect',()=>socket.emit('hello',{token}));

let adminLoggedIn=false;

$('#adminMiniBtn')?.addEventListener('click',()=>{
  $('#adminModal')?.classList.add('show');
});
$('#adminCloseBtn')?.addEventListener('click',()=>{
  $('#adminModal')?.classList.remove('show');
});

$('#adminLoginBtn')?.addEventListener('click',()=>{
  const password=String($('#adminPassword')?.value||'').trim();
  if(!password){ alert('방장 비밀번호를 입력해주세요.'); return; }
  socket.emit('adminLogin',{password});
});

socket.on('adminLoginResult',r=>{
  if(!r?.ok){ alert(r?.msg||'방장 로그인 실패'); return; }
  adminLoggedIn=true;
  const row=$('#adminLoginRow'); if(row)row.style.display='none';
  const pw=$('#adminPassword'); if(pw)pw.value='';
  $('#adminControls')?.classList.add('show');
  const mini=$('#adminMiniBtn');
  if(mini){ mini.textContent='ADMIN ✓'; mini.classList.add('adminOn'); }
  const m=$('#adminMsg'); if(m)m.textContent='방장 접속 완료 · 이 기기에서만 방장 기능 사용';
});

$('#adminStartBtn')?.addEventListener('click',()=>{
  if(!adminLoggedIn)return alert('먼저 방장 로그인 해주세요.');
  socket.emit('adminStartGame');
  $('#adminModal')?.classList.remove('show');
});

$('#adminStopBtn')?.addEventListener('click',()=>{
  if(!adminLoggedIn)return alert('먼저 방장 로그인 해주세요.');
  if(confirm('현재 게임판을 종료하고 좌석/게임 상태를 초기화할까요?')){
    socket.emit('adminStopGame');
    $('#adminModal')?.classList.remove('show');
  }
});

socket.on('adminGameStopped',()=>{
  mySeat=null;
  selected=null;
  pending=null;
  const m=$('#adminMsg'); if(m)m.textContent='게임판 종료 완료 · 새 참가자 착석 대기';
});


$('#exitResetBtn')?.addEventListener('click',()=>{
  if(!state.tournamentOver)return;
  if(!confirm('우승 결과를 종료하고 새 대회를 준비할까요? 모든 자리가 비워지며, 다시 10명이 모여야 게임이 시작됩니다.'))return;
  socket.emit('resetTournament',{token});
});
socket.on('tournamentReset',()=>{
  try{localStorage.removeItem('blackjackSeat')}catch(e){}
  mySeat=null;
  selected=null;
  pending=null;
  if(introScreen) introScreen.classList.remove('hide');
  const joinModal=$('#join');
  if(joinModal) joinModal.classList.remove('show');
  render();
});


setInterval(()=>{
 if(!state.insuranceOpen)return;
 const p=mySeat!==null?(state.players||[])[mySeat]:null;
 if(!p||p.insuranceDecision!==null)return;
 const sec=state.insuranceDeadline?Math.max(0,Math.ceil((state.insuranceDeadline-Date.now())/1000)):0;
 const el=$('#insuranceClock');
 if(el)el.textContent=`선택시간 ${sec}초 · 미선택 시 보험 안함`;
},250);

render();
window.addEventListener('load',()=>{
 if(window.matchMedia('(max-width:700px) and (orientation:portrait)').matches){
   requestAnimationFrame(()=>window.scrollTo({left:Math.max(0,(document.documentElement.scrollWidth-window.innerWidth)/2),top:0,behavior:'auto'}));
 }
});
